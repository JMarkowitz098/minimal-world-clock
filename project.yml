# XcodeGen spec — the source of truth for WorldClock.xcodeproj (generated, not committed).
# Regenerate after editing: xcodegen generate
name: WorldClock
options:
  bundleIdPrefix: com.jaredmarkowitz
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"

packages:
  WorldClockKit:
    path: Packages/WorldClockKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    # Every build, local ones included, is signed with the Apple Development certificate.
    # Ad-hoc signing ("-") isn't enough: macOS shows the widget but silently drops the zone
    # picked in its edit screen (found in M5). The release script (M11) signs for distribution.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: Y7W4DC22F6

targets:
  WorldClockMac:
    type: application
    platform: macOS
    sources: [Apps/Mac]
    dependencies:
      - package: WorldClockKit
        product: WorldClockCore
      - package: WorldClockKit
        product: WorldClockUI
      - target: MinimalWorldClockWidget  # embedded in Contents/PlugIns
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleDisplayName: Minimal World Clock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false  # no encryption beyond the OS; skips export questions on upload
        NSHumanReadableCopyright: © 2026 Jared Markowitz
    settings:
      base:
        PRODUCT_NAME: Minimal World Clock
        # Permanent once on the App Store; shared with a future iPhone app (Universal Purchase).
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredmarkowitz.minimalworldclock
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_ENTITLEMENTS: Apps/Mac/WorldClock.entitlements
        # Drawn by scripts/make-icon.swift into Apps/Mac/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Named after the app: Apple's Clock app ships an extension called WorldClockWidget.
  MinimalWorldClockWidget:
    type: app-extension
    platform: macOS
    sources: [Apps/Widget]
    preBuildScripts:
      # An ad-hoc signed widget registers and draws, but macOS silently drops the zone picked in
      # its edit screen (found in M5). Fail the build instead of producing one.
      - name: Require team signing
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CODE_SIGN_IDENTITY" = "-" ] || [ -z "$DEVELOPMENT_TEAM" ]; then
            echo "error: The widget must be signed with a development team (CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY, DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM). Ad-hoc signed widgets lose the zone the user picks. See project.yml."
            exit 1
          fi
    dependencies:
      - package: WorldClockKit
        product: WorldClockCore
      - package: WorldClockKit
        product: WorldClockUI
    info:
      path: Apps/Widget/Info.plist
      properties:
        CFBundleDisplayName: Minimal World Clock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: MinimalWorldClockWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredmarkowitz.minimalworldclock.widget
        ENABLE_HARDENED_RUNTIME: YES
        # Must match the app's versions, or App Store validation rejects the upload.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_ENTITLEMENTS: Apps/Widget/MinimalWorldClockWidget.entitlements
